<!-- Content-Security-Policy: defense-in-depth for the public site.
     Scripts stay 'unsafe-inline' only because head-custom.html needs a small
     inline layout script; all report text is sanitized before rendering. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  /* 水平布局：标题区 + GitHub 链接 两端对齐 */
  .page-header {
    padding: 0.9rem 2.5rem !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  /* 左侧：标题 + 副标题竖排 */
  .page-header .header-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15rem;
  }

  .project-name {
    font-size: 1.4rem !important;
    margin: 0 !important;
    line-height: 1.2;
  }

  .project-tagline {
    font-size: 0.82rem !important;
    margin: 0 !important;
    opacity: 0.82;
    line-height: 1.3;
  }

  /* 右侧：GitHub 按钮 */
  .page-header .btn {
    margin: 0 !important;
    padding: 0.4rem 1rem !important;
    font-size: 0.82rem !important;
    white-space: nowrap;
  }

  @media screen and (max-width: 42em) {
    .page-header {
      padding: 0.8rem 1.2rem !important;
    }
    .project-name {
      font-size: 1.15rem !important;
    }
  }

  /* 参考链接（details/summary）视觉样式 */
  .main-content details {
    margin: 0.6rem 0 0.9rem;
  }

  .main-content details > summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.32rem 0.9rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #1756a9;
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .main-content details > summary::-webkit-details-marker {
    display: none;
  }

  .main-content details > summary::before {
    content: "🔗";
    font-size: 0.8rem;
  }

  .main-content details > summary:hover,
  .main-content details > summary:focus-visible {
    background: #dfecfb;
    border-color: #a9c7ec;
    outline: none;
  }

  .main-content details > summary::after {
    content: "▸";
    margin-left: auto;
    transition: transform 0.15s ease;
  }

  .main-content details[open] > summary::after {
    transform: rotate(90deg);
  }

  .main-content details > ul {
    margin: 0.55rem 0 0;
    padding-left: 1.15rem;
  }

  .main-content details > ul > li {
    margin: 0.28rem 0;
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .main-content details > ul > li > a {
    color: #1f6feb;
    text-decoration: none;
    border-bottom: 1px dotted #a9c7ec;
    transition: color 0.15s ease, border-color 0.15s ease;
    word-break: break-word;
  }

  .main-content details > ul > li > a:hover {
    color: #0b3d91;
    border-bottom-style: solid;
  }
</style>

<script>
  /* 把 project-name 和 project-tagline 包进 .header-left div */
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector(".page-header");
    if (!header) return;
    var name = header.querySelector(".project-name");
    var tag  = header.querySelector(".project-tagline");
    if (!name) return;
    var wrap = document.createElement("div");
    wrap.className = "header-left";
    header.insertBefore(wrap, name);
    wrap.appendChild(name);
    if (tag) wrap.appendChild(tag);
  });
</script>
